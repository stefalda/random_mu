name: Web build CI

# The published site is built and pushed to gh-pages from the developer machine
# (see "Releasing" in README.md), so the deployed web matches the code that was
# tested in a browser. Kept for manual runs only.
on:
  workflow_dispatch:

jobs:
  build-and-release-android:
    runs-on: ubuntu-latest

    steps:
      # Checkout sources
      - uses: actions/checkout@v4

      # Install flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.1"
          channel: "stable"
          cache: true

      # Install dependencies
      - name: Get dependencies
        run: flutter pub get

      # Build Web version
      - name: Build Web
        run: |
          flutter build web --release --base-href="/random_mu/"

      # Deploy on GitHub Pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
